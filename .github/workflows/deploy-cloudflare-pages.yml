name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://wickbetts.com' }}
  CLOUDFLARE_DEPLOY_TARGET: ${{ secrets.CLOUDFLARE_DEPLOY_TARGET || vars.CLOUDFLARE_DEPLOY_TARGET || 'workers' }}
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
  CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME || vars.CLOUDFLARE_WORKER_NAME || 'polished-haze-422' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Must match the GitHub Environment where CLOUDFLARE_* and CLERK_* vars are defined.
    # In this repo, the configured environment label is "stunning-gratitude / production".
    environment: "stunning-gratitude / production"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: WickBettsApp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: WickBettsApp
        run: pnpm install --frozen-lockfile

      - name: Clear previous mobile web bundle
        working-directory: WickBettsApp
        run: rm -rf artifacts/wick-betts-mobile/dist

      - name: Build mobile web app
        working-directory: WickBettsApp
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
        run: pnpm --filter @workspace/wick-betts-mobile build:web

      - name: Verify deploy artifact routes
        working-directory: WickBettsApp/artifacts/wick-betts-mobile/dist
        run: |
          test -f _redirects
          test -f _worker.js
          test -f index.html

      - name: Deploy to Cloudflare
        working-directory: WickBettsApp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_TARGET: ${{ env.CLOUDFLARE_DEPLOY_TARGET }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Missing Cloudflare token. Set one of: CLOUDFLARE_API_TOKEN or CF_API_TOKEN (secret or variable)."; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing Cloudflare account id. Set one of: CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID (secret or variable)."; exit 1; }
          case "$CLOUDFLARE_DEPLOY_TARGET" in
            pages|workers) ;;
            *)
              echo "Invalid CLOUDFLARE_DEPLOY_TARGET='$CLOUDFLARE_DEPLOY_TARGET'. Use 'pages' or 'workers'."
              exit 1
              ;;
          esac
          if [ "$CLOUDFLARE_DEPLOY_TARGET" = "pages" ]; then
            [ -n "$CLOUDFLARE_PAGES_PROJECT_NAME" ] || { echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME for Pages deploy target."; exit 1; }
            echo "Deploy mode: Cloudflare Pages project '$CLOUDFLARE_PAGES_PROJECT_NAME'"
            echo "Required token scope: Cloudflare Pages Edit (and account access to the target project)."
            pnpm dlx wrangler@4 pages deploy artifacts/wick-betts-mobile/dist \
              --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
              --branch=main \
              --commit-hash="${GITHUB_SHA}"
          else
            [ -n "$CLOUDFLARE_WORKER_NAME" ] || { echo "Missing deploy target. Set CLOUDFLARE_PAGES_PROJECT_NAME (for Pages) or CLOUDFLARE_WORKER_NAME (for Workers)."; exit 1; }
            echo "Deploy mode: Cloudflare Worker '$CLOUDFLARE_WORKER_NAME' (CLOUDFLARE_DEPLOY_TARGET=${CLOUDFLARE_DEPLOY_TARGET})"
            echo "Required token scope: Workers Scripts Edit (account-level)."
            printf "%s\n" "_worker.js" > artifacts/wick-betts-mobile/dist/.assetsignore
            pnpm dlx wrangler@4 deploy artifacts/wick-betts-mobile/dist/_worker.js \
              --name="$CLOUDFLARE_WORKER_NAME" \
              --assets=artifacts/wick-betts-mobile/dist \
              --compatibility-date="$(date +%F)"
            # Push CLERK_SECRET_KEY as a Worker secret so the Clerk FAPI proxy works
            if [ -z "$CLERK_SECRET_KEY" ]; then
              echo "WARNING: CLERK_SECRET_KEY is not set — Clerk proxy will return 501. Add it to the GitHub environment secrets."
            else
              echo "Setting CLERK_SECRET_KEY Worker secret..."
              printf '%s' "$CLERK_SECRET_KEY" | pnpm dlx wrangler@4 secret put CLERK_SECRET_KEY \
                --name="$CLOUDFLARE_WORKER_NAME" && echo "CLERK_SECRET_KEY secret set successfully."
            fi
          fi

      - name: Sync Worker secrets
        if: env.CLOUDFLARE_DEPLOY_TARGET != 'pages'
        working-directory: WickBettsApp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          WORKER="${CLOUDFLARE_WORKER_NAME:-polished-haze-422}"
          echo "Syncing secrets to Worker: $WORKER"
          if [ -n "$CLERK_SECRET_KEY" ]; then
            printf '%s' "$CLERK_SECRET_KEY" | pnpm dlx wrangler@4 secret put CLERK_SECRET_KEY --name="$WORKER"
            echo "✓ CLERK_SECRET_KEY synced"
          else
            echo "✗ CLERK_SECRET_KEY missing from GitHub secrets — add it to stunning-gratitude/production"
            exit 1
          fi
