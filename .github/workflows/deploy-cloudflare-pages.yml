name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://wickbetts.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: WickBettsApp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: WickBettsApp
        run: pnpm install --frozen-lockfile

      - name: Build mobile web app
        working-directory: WickBettsApp
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
        run: pnpm --filter @workspace/wick-betts-mobile build:web

      - name: Verify deploy artifact routes
        working-directory: WickBettsApp/artifacts/wick-betts-mobile/dist
        run: |
          test -f _redirects
          test -f _worker.js
          test -f index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy WickBettsApp/artifacts/wick-betts-mobile/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || 'polished-haze-422' }}
            --branch=main
            --commit-hash=${{ github.sha }}
