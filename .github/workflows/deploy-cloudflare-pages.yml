name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://wickbetts.com' }}
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'polished-haze-422' }}
  CLOUDFLARE_API_TOKEN_RESOLVED: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID_RESOLVED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: WickBettsApp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: WickBettsApp
        run: pnpm install --frozen-lockfile

      - name: Build mobile web app
        working-directory: WickBettsApp
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
        run: pnpm --filter @workspace/wick-betts-mobile build:web

      - name: Verify deploy artifact routes
        working-directory: WickBettsApp/artifacts/wick-betts-mobile/dist
        run: |
          test -f _redirects
          test -f _worker.js
          test -f index.html

      - name: Validate Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN_RESOLVED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID_RESOLVED }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$CLOUDFLARE_PAGES_PROJECT_NAME" ] || { echo "Missing project name for Cloudflare Pages"; exit 1; }

      - name: Deploy to Cloudflare Pages
        working-directory: WickBettsApp
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN_RESOLVED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID_RESOLVED }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          pnpm dlx wrangler@4 pages deploy artifacts/wick-betts-mobile/dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}"
