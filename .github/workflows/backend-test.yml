name: Backend Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wickbetts_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/wickbetts_test
      NODE_ENV: test
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || 'pk_test_xxxxxxxxxxxxxxxxx' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY || 'sk_test_xxxxxxxxxxxxxxxxx' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET || 'test-session-secret' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: WickBettsApp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: WickBettsApp
        run: pnpm install --frozen-lockfile

      - name: Build API server
        working-directory: WickBettsApp
        run: pnpm --filter @workspace/api-server build

      - name: Create test database schema
        working-directory: WickBettsApp
        run: pnpm --filter @workspace/db push-force

      - name: Run API smoke tests
        working-directory: WickBettsApp
        run: pnpm --filter @workspace/api-server test
