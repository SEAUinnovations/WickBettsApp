name: Backend Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stripe-readiness:
    name: Stripe readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ORIGIN_TO_TEST: https://wickbetts.com
      RAILWAY_ORIGIN_TO_TEST: https://wickbettsapp-production.up.railway.app
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
      ENFORCE_TEST_KEY_PREFIX: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stripe readiness checks
        run: pnpm run verify:stripe:prod-test
